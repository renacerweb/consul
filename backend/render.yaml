services:
  - type: web
    name: renacer-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_KEEPALIVE_INTERVAL_MINUTES
        sync: false

  - type: cron
    name: renacer-backend-keepalive
    schedule: '0 0 * * 0'
    command: curl -fsS https://renacer-backend.onrender.com/api/health || exit 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_KEEPALIVE_INTERVAL_MINUTES
        sync: false
